[package]
name = "pkgdu"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Real disk usage per package for Arch Linux"
license = "GPL-3.0-or-later"
repository = "https://github.com/YOURUSER/pkgdu"
readme = "README.md"
keywords = ["arch", "pacman", "disk-usage", "cli", "btrfs"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
rayon = "1.10"
nix = { version = "0.29", features = ["fs"] }
libc = "0.2"
regex = "1"
unicode-width = "0.2"
owo-colors = { version = "4", features = ["supports-colors"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
incremental = false
