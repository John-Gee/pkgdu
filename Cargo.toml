[package]
name = "pkgdu"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Real disk usage per package for Arch Linux"
license = "GPL-3.0-or-later"
repository = "https://github.com/John-Gee/pkgdu"
readme = "README.md"
keywords = ["arch", "pacman", "disk-usage", "cli", "btrfs"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
rayon = "1.10"
nix = "0.31"
regex = "1"
btrfs-uapi = "0.13"
btrfs-disk = "0.13"
unicode-width = "0.2"
owo-colors = "4"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
incremental = false

